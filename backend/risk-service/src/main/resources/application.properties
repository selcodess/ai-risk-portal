server.port=8080
spring.application.name=risk-service

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:riskdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=swisscom-riskpilot-jwt-secret-key-2026-minimum-32-chars
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200

# Logging
logging.level.com.swisscom.riskpilot=INFO
